[build]
  base = "client"
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  # Tells Vite which backend to call in production builds.
  # Override this in Netlify Dashboard → Site Settings → Environment Variables
  # if your Render backend URL changes.
  VITE_API_URL = "https://ai-resume-analyzer-olha.onrender.com"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
