services:
  - type: web
    name: ai-resume-analysier-api
    runtime: node
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        value: https://elegant-lokum-cf3449.netlify.app
      - key: GEMINI_API_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
